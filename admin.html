<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ALPHA-SEC // بوابة الإدارة والمدير</title>
<style>
*{box-sizing:border-box;font-family:Tahoma,Arial,sans-serif}
body{margin:0;padding:0 0 75px;background:#030712;color:#f3f4f6;font-size:15px}
.wrap{max-width:980px;margin:0 auto;padding:18px 18px 0}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #fb718555;padding-bottom:14px;margin-bottom:22px;flex-wrap:wrap}
header h1{margin:0;font-size:20px;color:#fff}
header .sub{font-size:13px;color:#fb7185;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:18px}
.card{background:#0b0f19;border:1px solid #fb718566;border-radius:16px;padding:18px}
.card .k{font-size:13px;color:#94a3b8;display:block;margin-bottom:6px}
.card .v{font-size:20px;font-weight:bold;color:#34d399}
.panel{background:#0b0f19;border:1px solid #fb718566;border-radius:16px;padding:20px}
button,.btn-d{cursor:pointer;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#f1f5f9;padding:10px 14px;font-weight:bold;font-size:13px;text-decoration:none;display:inline-block}
.btn-g{background:#10b981;color:#000;border:0}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
th,td{border:1px solid #1e293b;padding:10px;text-align:right}
th{background:#020617;color:#fb7185}
footer{position:fixed;bottom:0;left:0;width:100%;background:#0f172a;border-top:1px solid #fb718555;padding:12px;text-align:center;font-size:13px;color:#cbd5e1;z-index:10}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>بوابة الإدارة / المدير</h1>
      <div class="sub">إعدادية المعرفة المهنية الاهلية // برمجة: عباس محمد عزيز</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button type="button" id="btn-refresh" class="btn-g">تحديث المحصل</button>
      <a href="accounts.html" class="btn-d">بوابة الحسابات</a>
      <a href="index.html" class="btn-d">الرئيسية</a>
    </div>
  </header>

  <div class="stats">
    <div class="card">
      <span class="k">المحصل المالي الكلي (دينار عراقي)</span>
      <span id="adm-total" class="v">0 د.ع</span>
    </div>
    <div class="card">
      <span class="k">عدد الدفعات والأقساط</span>
      <span id="adm-count" class="v" style="color:#38bdf8">0</span>
    </div>
    <div class="card">
      <span class="k">حالة الربط المالي</span>
      <span id="adm-sync" class="v" style="font-size:15px;color:#fbbf24">جاري الجلب...</span>
    </div>
  </div>

  <div class="panel">
    <h3 style="margin-top:0;color:#fb7185">تفاصيل الأقساط والدفعات المستلمة</h3>
    <table>
      <thead>
        <tr>
          <th>الطالب</th>
          <th>نوع الدفعة</th>
          <th>المبلغ</th>
          <th>التاريخ</th>
        </tr>
      </thead>
      <tbody id="adm-body"></tbody>
    </table>
  </div>
</div>

<footer>برمجة وتطوير: <strong style="color:#fb7185">عباس محمد عزيز</strong></footer>

<script>
var FIREBASE_DB_URL = "https://al-maarefa-school-default-rtdb.firebaseio.com";
var LOCAL_KEY = "alpha_sec_accounts_iqd";

function formatIQD(num){
  var n = Number(num) || 0;
  return n.toLocaleString("en-US") + " د.ع";
}

function renderAdminAccounts(rows){
  var totalEl = document.getElementById("adm-total");
  var countEl = document.getElementById("adm-count");
  var tb = document.getElementById("adm-body");
  var sum = 0;
  for(var i = 0; i < rows.length; i++){
    sum += Number(rows[i].amount) || 0;
  }
  if(totalEl) totalEl.innerText = formatIQD(sum);
  if(countEl) countEl.innerText = String(rows.length);
  if(!tb) return;

  tb.innerHTML = "";
  if(!rows.length){
    tb.innerHTML = "<tr><td colspan='4' style='text-align:center;color:#94a3b8'>لا توجد أقساط أو دفعات مسجلة حالياً</td></tr>";
    return;
  }
  for(var j = 0; j < rows.length; j++){
    var r = rows[j];
    var tr = document.createElement("tr");
    tr.innerHTML =
      "<td>" + (r.student || "") + "</td>" +
      "<td>" + (r.type || "دفعة اولى") + "</td>" +
      "<td><strong>" + formatIQD(r.amount) + "</strong></td>" +
      "<td>" + (r.date || "") + "</td>";
    tb.appendChild(tr);
  }
}

function loadAdminFinance(){
  var local = [];
  try {
    var parsed = JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]");
    if(Array.isArray(parsed)) local = parsed;
  } catch(e){}
  renderAdminAccounts(local);

  var syncEl = document.getElementById("adm-sync");
  var base = String(FIREBASE_DB_URL || "").trim().replace(/\/+$/, "");
  if(!base){
    if(syncEl) syncEl.innerText = "محلي";
    return;
  }

  fetch(base + "/alpha_sec/accounts.json").then(function(res){
    if(!res.ok) throw new Error("net");
    return res.json();
  }).then(function(data){
    var arr = Array.isArray(data) ? data : (data ? Object.values(data) : []);
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(arr)); } catch(e){}
    renderAdminAccounts(arr);
    if(syncEl){
      syncEl.innerText = "مزامنة سحابية نشطة";
      syncEl.style.color = "#34d399";
    }
  }).catch(function(){
    if(syncEl){
      syncEl.innerText = "احتياط محلي";
      syncEl.style.color = "#fbbf24";
    }
  });
}

document.getElementById("btn-refresh").onclick = loadAdminFinance;
loadAdminFinance();
</script>
</body>
</html>
