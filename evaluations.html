<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ALPHA-SEC // بوابة الإعلان المركزي</title>
<style>
*{box-sizing:border-box;font-family:Tahoma,Arial,sans-serif}
body{margin:0;padding:0 0 92px;background:#030712;color:#f3f4f6;font-size:15px}
.wrap{max-width:960px;margin:0 auto;padding:18px 18px 0}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #2dd4bf55;padding-bottom:14px;margin-bottom:22px;flex-wrap:wrap}
header h1{margin:0;font-size:20px;color:#fff}
header .sub{font-size:13px;color:#2dd4bf;margin-top:4px}
.sync-badge{font-size:12px;padding:5px 10px;border-radius:999px;background:#0b1324;border:1px solid #2dd4bf55;color:#2dd4bf}
.panel{background:#0b0f19;border:1px solid #2dd4bf66;border-radius:16px;padding:20px;margin-bottom:18px}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:14px}
input,textarea{width:100%;padding:12px 14px;margin-bottom:12px;border-radius:10px;border:1px solid #334155;background:#020617;color:#fff;font-size:15px}
textarea{min-height:110px;resize:vertical}
button,.btn-d{cursor:pointer;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#f1f5f9;padding:10px 16px;font-weight:bold;font-size:14px;text-decoration:none;display:inline-block;text-align:center}
.btn-t{background:#2dd4bf;color:#000;border:0}
.btn-g{background:#10b981;color:#000;border:0}
.btn-r{background:#dc2626;color:#fff;border:0}
#auth-box,#form-box{display:none;background:#020617;border:1px solid #2dd4bf66;border-radius:14px;padding:16px;margin-bottom:16px}
.ann-card{background:#020617;border:1px solid #1e293b;border-radius:14px;padding:16px;margin-bottom:14px}
.ann-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ann-topic{font-size:17px;font-weight:bold;color:#2dd4bf;margin:0}
.ann-meta{font-size:12px;color:#94a3b8}
.ann-body{font-size:14px;color:#f3f4f6;line-height:1.7;white-space:pre-line;margin:0}
.empty{text-align:center;color:#94a3b8;padding:18px}
footer{position:fixed;bottom:0;left:0;width:100%;background:#0f172a;border-top:1px solid #2dd4bf55;padding:10px 12px;text-align:center;font-size:13px;color:#cbd5e1;z-index:10}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>بوابة الإعلان المركزي</h1>
      <div class="sub">إعدادية المعرفة المهنية الاهلية // برمجة: عباس محمد عزيز</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span id="cloud-status" class="sync-badge">متصل سحابياً (Firebase)</span>
      <button type="button" id="btn-open-add" class="btn-t">إضافة إعلان</button>
      <a href="index.html" class="btn-d">الرئيسية</a>
    </div>
  </header>

  <!-- إدخال رمز الأستاذ (300400) -->
  <div id="auth-box">
    <h3 style="margin-top:0;color:#2dd4bf">تحقق صلاحية إضافة الإعلان</h3>
    <div style="font-size:13px;color:#94a3b8;margin-bottom:10px">أدخل رمز إضافة الإعلان الخاص بالأستاذ للمتابعة</div>
    <input type="password" id="ann-code-input" placeholder="أدخل الرمز السري">
    <div class="bar" style="margin-bottom:0">
      <button type="button" id="btn-verify-code" class="btn-g">تأكيد الرمز</button>
      <button type="button" id="btn-cancel-auth" class="btn-d">إلغاء</button>
    </div>
  </div>

  <!-- نموذج إضافة إعلان (1. اسم المعلن، 2. الموضوع، 3. المحتوى) -->
  <div id="form-box">
    <div class="bar">
      <h3 style="margin:0;color:#2dd4bf">نشر إعلان جديد</h3>
      <button type="button" id="btn-close-form" class="btn-d">إغلاق</button>
    </div>

    <label style="display:block;font-size:13px;color:#cbd5e1;margin-bottom:4px">أولاً: اسم المعلن</label>
    <input type="text" id="ann-author" placeholder="مثال: أ. محمد علي">

    <label style="display:block;font-size:13px;color:#cbd5e1;margin-bottom:4px">ثانياً: الموضوع</label>
    <input type="text" id="ann-subject" placeholder="مثال: جدول الامتحانات الشهرية">

    <label style="display:block;font-size:13px;color:#cbd5e1;margin-bottom:4px">ثالثاً: المحتوى</label>
    <textarea id="ann-content" placeholder="اكتب تفاصيل الإعلان هنا..."></textarea>

    <button type="button" id="btn-publish-ann" class="btn-t" style="width:100%">نشر الإعلان</button>
  </div>

  <!-- عرض جميع الإعلانات للطلاب والزوار -->
  <div class="panel">
    <div class="bar">
      <h3 style="margin:0;color:#2dd4bf">جميع الإعلانات المنشورة</h3>
      <input type="text" id="ann-search" style="max-width:280px;margin:0;padding:8px 12px;font-size:13px" placeholder="بحث في الإعلانات...">
    </div>
    <div id="ann-list"></div>
  </div>
</div>

<footer>
  <div>برمجة وتطوير: <strong style="color:#2dd4bf">عباس محمد عزيز</strong></div>
  <div style="margin-top:3px;font-size:12px;color:#94a3b8">تحت تدريب الأستاذة أسمى حيدر</div>
</footer>

<script>
var FIREBASE_DB_URL = "https://al-maarefa-school-default-rtdb.firebaseio.com";
var ADD_ANN_CODE = "300400";
var announcementsData = [];
var isVerifiedTeacher = false;

function readAnnouncements(){
  try {
    var d = JSON.parse(localStorage.getItem("al_d_ann") || "[]");
    return Array.isArray(d) ? d : [];
  } catch(e){ return []; }
}

function writeAnnouncements(arr){
  try { localStorage.setItem("al_d_ann", JSON.stringify(arr)); } catch(e){}
}

function cloudAnnUrl(){
  var base = String(FIREBASE_DB_URL || "").trim().replace(/\/+$/, "");
  return base ? (base + "/alpha_sec/announcements.json") : "";
}

function setStatus(txt, ok){
  var el = document.getElementById("cloud-status");
  if(!el) return;
  el.innerText = txt;
  el.style.color = ok ? "#34d399" : "#fbbf24";
}

function renderAnnouncements(){
  var q = (document.getElementById("ann-search").value || "").trim().toLowerCase();
  var listEl = document.getElementById("ann-list");
  listEl.innerHTML = "";

  var filtered = announcementsData.filter(function(item){
    if(!q) return true;
    var hay = ((item.author || "") + " " + (item.subject || "") + " " + (item.content || "")).toLowerCase();
    return hay.indexOf(q) > -1;
  });

  if(!filtered.length){
    listEl.innerHTML = "<div class='empty'>لا توجد إعلانات منشورة حالياً.</div>";
    return;
  }

  for(var i = 0; i < filtered.length; i++){
    (function(item){
      var card = document.createElement("div");
      card.className = "ann-card";
      card.innerHTML =
        "<div class='ann-top'>" +
          "<h4 class='ann-topic'>" + (item.subject || "بدون موضوع") + "</h4>" +
          "<span class='ann-meta'>المعلن: <strong style='color:#e2e8f0'>" + (item.author || "الأستاذ") + "</strong> — " + (item.date || "") + "</span>" +
        "</div>" +
        "<p class='ann-body'>" + (item.content || "") + "</p>";
      listEl.appendChild(card);
    })(filtered[i]);
  }
}

function pullAnnouncements(){
  announcementsData = readAnnouncements();
  renderAnnouncements();
  var u = cloudAnnUrl();
  if(!u){ setStatus("وضع محلي", false); return; }
  fetch(u)
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(data){
      if(data !== null && data !== undefined){
        announcementsData = Array.isArray(data) ? data : Object.values(data);
        writeAnnouncements(announcementsData);
        setStatus("متصل سحابياً (Firebase)", true);
      } else {
        setStatus("احتياط محلي", false);
      }
      renderAnnouncements();
    })
    .catch(function(){
      setStatus("احتياط محلي", false);
      renderAnnouncements();
    });
}

function saveAnnouncement(){
  var author = document.getElementById("ann-author").value.trim();
  var subject = document.getElementById("ann-subject").value.trim();
  var content = document.getElementById("ann-content").value.trim();

  if(!author){ alert("يرجى كتابة اسم المعلن أولاً"); return; }
  if(!subject){ alert("يرجى كتابة موضوع الإعلان ثانياً"); return; }
  if(!content){ alert("يرجى كتابة محتوى الإعلان ثالثاً"); return; }

  var newItem = {
    author: author,
    subject: subject,
    content: content,
    date: new Date().toLocaleDateString("ar-IQ")
  };

  announcementsData.unshift(newItem);
  writeAnnouncements(announcementsData);
  renderAnnouncements();

  document.getElementById("ann-author").value = "";
  document.getElementById("ann-subject").value = "";
  document.getElementById("ann-content").value = "";

  var u = cloudAnnUrl();
  if(u){
    fetch(u, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(announcementsData)
    }).catch(function(){});
  }

  alert("تم نشر الإعلان بنجاح");
}

document.getElementById("btn-open-add").onclick = function(){
  if(isVerifiedTeacher){
    document.getElementById("auth-box").style.display = "none";
    document.getElementById("form-box").style.display = "block";
    return;
  }
  document.getElementById("form-box").style.display = "none";
  document.getElementById("auth-box").style.display = "block";
  document.getElementById("ann-code-input").value = "";
  document.getElementById("ann-code-input").focus();
};

document.getElementById("btn-verify-code").onclick = function(){
  var code = document.getElementById("ann-code-input").value.trim();
  if(code === ADD_ANN_CODE){
    isVerifiedTeacher = true;
    document.getElementById("auth-box").style.display = "none";
    document.getElementById("form-box").style.display = "block";
    document.getElementById("ann-author").focus();
  } else {
    alert("الرمز السري لإضافة الإعلان غير صحيح");
  }
};

document.getElementById("ann-code-input").addEventListener("keydown", function(e){
  if(e.key === "Enter") document.getElementById("btn-verify-code").click();
});

document.getElementById("btn-cancel-auth").onclick = function(){
  document.getElementById("auth-box").style.display = "none";
};

document.getElementById("btn-close-form").onclick = function(){
  document.getElementById("form-box").style.display = "none";
};

document.getElementById("btn-publish-ann").onclick = saveAnnouncement;
document.getElementById("ann-search").oninput = renderAnnouncements;

pullAnnouncements();
</script>
</body>
</html>
