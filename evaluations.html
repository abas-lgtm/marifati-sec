<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>بوابة التقييم — ALPHA-SEC</title>
<style>
*{box-sizing:border-box;font-family:Segoe UI,Tahoma,Arial,sans-serif}
body{margin:0;padding:22px 16px 85px;background:linear-gradient(180deg,#081120 0%,#0f1c33 100%);color:#f8fafc;min-height:100vh}
.container{max-width:980px;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#132238;border:1px solid #2dd4bf55;border-radius:18px;padding:16px 20px;margin-bottom:24px}
.topbar h1{margin:0;font-size:21px;color:#5eead4}
.topbar span{font-size:13px;color:#94a3b8}
.auth-card{max-width:460px;margin:36px auto;background:#132238;border:1.5px solid #2dd4bf66;border-radius:22px;padding:26px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.panel-box{display:none;background:#132238;border:1.5px solid #2dd4bf66;border-radius:22px;padding:24px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
input,select{width:100%;padding:14px 16px;margin-bottom:14px;border-radius:13px;border:1px solid #334155;background:#091324;color:#fff;font-size:16px}
input:focus,select:focus{outline:none;border-color:#2dd4bf}
button{cursor:pointer;border:0;border-radius:13px;padding:13px 18px;font-weight:700;font-size:15px}
.btn-teal{background:#14b8a6;color:#041312}
.btn-sky{background:#0ea5e9;color:#04131c}
.btn-slate{background:#1e293b;color:#e2e8f0;border:1px solid #475569}
.btn-rose{background:#e11d48;color:#fff}
.flex-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:14px}
table{width:100%;border-collapse:collapse;margin-top:16px;font-size:15px;background:#091324;border-radius:14px;overflow:hidden}
th,td{border:1px solid #1e293b;padding:11px 12px;text-align:right}
th{background:#172a45;color:#5eead4}
.foot{position:fixed;bottom:0;left:0;width:100%;background:#091324;border-top:1px solid #2dd4bf44;padding:12px;text-align:center;font-size:13px;color:#cbd5e1}
@media print{body{background:#fff;color:#000;padding:0}.no-print,.foot{display:none!important}table{background:#fff}th,td{border:1px solid #000;color:#000}}
</style>
</head>
<body>
<div class="container">
  <div class="topbar no-print">
    <div>
      <h1>بوابة التقييم والمتابعة</h1>
      <span>إعدادية المعرفة المهنية الاهلية — عباس محمد عزيز</span>
    </div>
    <button type="button" class="btn-slate" onclick="goMain()">الرئيسية</button>
  </div>

  <div id="gate-box" class="auth-card">
    <h2 style="margin:0 0 8px;color:#2dd4bf;text-align:center;font-size:22px">تسجيل دخول التقييم</h2>
    <div id="gate-status" style="text-align:center;font-size:14px;color:#cbd5e1;margin-bottom:16px">المحاولات المتبقية: 10 من 10</div>
    <input type="password" id="eval-code" placeholder="أدخل الرمز السري">
    <div class="flex-row" style="margin-bottom:0">
      <button type="button" class="btn-teal" style="flex:1" onclick="verifyEvaluations()">دخول إلى التقييم</button>
      <button type="button" class="btn-slate" onclick="goMain()">رجوع</button>
    </div>
  </div>

  <div id="work-box" class="panel-box">
    <div class="flex-row no-print">
      <h2 style="margin:0;color:#5eead4;font-size:21px">سجل تقييم الطلبة</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="btn-sky" onclick="window.print()">طباعة PDF</button>
        <button type="button" class="btn-slate" onclick="goMain()">الرئيسية</button>
      </div>
    </div>

    <div class="no-print">
      <input type="text" id="ev-student" placeholder="اسم الطالب">
      <select id="ev-class">
        <option>اول امن سيبراني A</option>
        <option>اول امن سيبراني B</option>
        <option>اول امن سيبراني C</option>
        <option>اول تكرير نفط A</option>
        <option>اول تجميع حاسوب A</option>
        <option>اول اجهزه طبية A</option>
      </select>
      <select id="ev-type">
        <option>تقييم شهري</option>
        <option>تقييم عملي</option>
        <option>تقييم سلوكي</option>
      </select>
      <input type="number" id="ev-score" min="0" max="100" placeholder="التقييم من 100">
      <button type="button" class="btn-teal" style="width:100%;margin-bottom:14px" onclick="storeEvaluation()">حفظ التقييم</button>
      <input type="text" id="ev-filter" oninput="paintEvaluations()" placeholder="بحث باسم الطالب أو الصف أو النوع...">
    </div>

    <table>
      <thead>
        <tr>
          <th>الطالب</th>
          <th>الصف</th>
          <th>النوع</th>
          <th>الدرجة</th>
          <th class="no-print">حذف</th>
        </tr>
      </thead>
      <tbody id="eval-rows"></tbody>
    </table>
  </div>
</div>

<div class="foot">برمجة وتطوير: <strong style="color:#5eead4">عباس محمد عزيز</strong></div>

<script>
var LIMIT_TRIES = 10;
var EVAL_PIN = "300400";

function goMain() {
  window.location.href = "index.html";
}

function banDuration(guess, target) {
  guess = String(guess || "").trim();
  target = String(target || "").trim();
  var diffLen = Math.abs(guess.length - target.length);
  var sameChars = 0;
  var pool = target.split("");
  for (var i = 0; i < guess.length; i++) {
    var pos = pool.indexOf(guess[i]);
    if (pos > -1) {
      sameChars++;
      pool.splice(pos, 1);
    }
  }
  var ratio = sameChars / Math.max(guess.length, target.length, 1);
  var numG = Number(guess);
  var numT = Number(target);
  if ((!isNaN(numG) && !isNaN(numT) && numT > 0 && Math.abs(numG - numT) / numT <= 0.25) || (ratio >= 0.6 && diffLen <= 1)) return 72;
  if (ratio >= 0.35 && diffLen <= 2) return 96;
  return 120;
}

function readLock() {
  try {
    var raw = JSON.parse(localStorage.getItem("alpha_ev_lock_v2") || "{}");
    if (raw.until && Date.now() >= Number(raw.until)) {
      var reset = { tries: 0, until: 0, hrs: 0 };
      localStorage.setItem("alpha_ev_lock_v2", JSON.stringify(reset));
      return reset;
    }
    return { tries: Number(raw.tries || 0), until: Number(raw.until || 0), hrs: Number(raw.hrs || 0) };
  } catch (e) {
    return { tries: 0, until: 0, hrs: 0 };
  }
}

function writeLock(val) {
  try { localStorage.setItem("alpha_ev_lock_v2", JSON.stringify(val)); } catch (e) {}
}

function leftTimeText(ms) {
  var hrs = Math.max(1, Math.ceil(ms / 3600000));
  return Math.floor(hrs / 24) + " يوم و " + (hrs % 24) + " ساعة (" + hrs + " ساعة)";
}

function refreshLockBanner() {
  var box = document.getElementById("gate-status");
  var st = readLock();
  if (!box) return;
  if (st.until && Date.now() < st.until) {
    box.innerText = "محظور " + st.hrs + " ساعة — المتبقي: " + leftTimeText(st.until - Date.now());
  } else {
    box.innerText = "المحاولات المتبقية: " + Math.max(0, LIMIT_TRIES - st.tries) + " من " + LIMIT_TRIES;
  }
}

function verifyEvaluations() {
  var st = readLock();
  if (st.until && Date.now() < st.until) {
    alert("محظور " + st.hrs + " ساعة.\nالمتبقي: " + leftTimeText(st.until - Date.now()));
    return;
  }
  var input = document.getElementById("eval-code");
  var code = input ? input.value.trim() : "";
  if (code === EVAL_PIN) {
    writeLock({ tries: 0, until: 0, hrs: 0 });
    input.value = "";
    document.getElementById("gate-box").style.display = "none";
    document.getElementById("work-box").style.display = "block";
    paintEvaluations();
  } else {
    st.tries++;
    if (st.tries > LIMIT_TRIES) {
      var hrs = banDuration(code, EVAL_PIN);
      writeLock({ tries: st.tries, until: Date.now() + hrs * 3600000, hrs: hrs });
      refreshLockBanner();
      alert("تجاوزت 10 محاولات! حظر " + hrs + " ساعة");
    } else {
      writeLock(st);
      refreshLockBanner();
      alert("الرمز خطأ! المتبقي: " + (LIMIT_TRIES - st.tries));
    }
  }
}

function readEvaluations() {
  try { return JSON.parse(localStorage.getItem("alpha_ev_rows_v2") || "[]"); } catch (e) { return []; }
}

function writeEvaluations(list) {
  try { localStorage.setItem("alpha_ev_rows_v2", JSON.stringify(list)); } catch (e) {}
}

function storeEvaluation() {
  var student = document.getElementById("ev-student").value.trim();
  var grade = document.getElementById("ev-class").value;
  var type = document.getElementById("ev-type").value;
  var scoreInput = document.getElementById("ev-score");
  var score = Number(scoreInput.value);
  if (!student || scoreInput.value === "") {
    alert("أدخل اسم الطالب والدرجة");
    return;
  }
  if (score < 0 || score > 100) {
    alert("الدرجة يجب أن تكون بين 0 و 100");
    return;
  }
  var rows = readEvaluations();
  rows.unshift({ student: student, grade: grade, type: type, score: score });
  writeEvaluations(rows);
  document.getElementById("ev-student").value = "";
  scoreInput.value = "";
  paintEvaluations();
}

function removeEvaluation(index) {
  var rows = readEvaluations();
  rows.splice(index, 1);
  writeEvaluations(rows);
  paintEvaluations();
}

function paintEvaluations() {
  var q = (document.getElementById("ev-filter").value || "").trim().toLowerCase();
  var rows = readEvaluations();
  var html = "";
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    if (!q || (r.student + " " + r.grade + " " + r.type).toLowerCase().indexOf(q) > -1) {
      html += "<tr><td>" + r.student + "</td><td>" + r.grade + "</td><td>" + r.type + "</td><td><strong>" + r.score + " / 100</strong></td><td class='no-print'><button type='button' class='btn-rose' onclick='removeEvaluation(" + i + ")'>حذف</button></td></tr>";
    }
  }
  document.getElementById("eval-rows").innerHTML = html;
}

refreshLockBanner();
</script>
</body>
</html>
