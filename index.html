<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPHA-SEC // النظام الخفيف</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: 'Cairo', sans-serif; background-color: #030712; color: #f3f4f6; }</style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6">

    <header class="flex justify-between items-center border-b border-emerald-500/30 pb-4">
        <h1 class="text-emerald-400 font-bold">ALPHA_SEC // SYSTEM</h1>
        <button onclick="nav('home')" class="bg-slate-900 text-emerald-400 px-3 py-1 rounded border border-emerald-500/30 text-sm">الرئيسية</button>
    </header>

    <main class="max-w-xl mx-auto w-full text-center my-auto">
        <!-- الرئيسية -->
        <div id="v-home" class="space-y-4">
            <h2 class="text-2xl font-bold text-white">اختر البوابة</h2>
            <button onclick="nav('ast')" class="w-full bg-[#0b0f19] border border-emerald-500/40 p-6 rounded-xl text-emerald-400 font-bold text-lg">بوابة المعاون (2020)</button>
            <button onclick="nav('tch')" class="w-full bg-[#0b0f19] border border-cyan-500/40 p-6 rounded-xl text-cyan-400 font-bold text-lg">بوابة المدرسين</button>
        </div>

        <!-- دخول المعاون -->
        <div id="v-ast-login" class="hidden space-y-4">
            <h3 class="text-xl text-emerald-400 font-bold">دخول المعاون</h3>
            <input type="password" id="pass" placeholder="رمز المرور (2020)" class="w-full bg-slate-950 border border-slate-800 p-3 rounded text-white">
            <button onclick="checkAst()" class="w-full bg-emerald-500 text-black font-bold p-3 rounded">دخول</button>
        </div>

        <!-- لوحة المعاون -->
        <div id="v-ast-dash" class="hidden space-y-4">
            <h3 class="text-xl text-emerald-400 font-bold">سجل الغيابات</h3>
            <button onclick="clearData('abs')" class="bg-red-600 text-white px-4 py-2 rounded text-sm">🗑️ مسح السجل بالكامل</button>
            <p class="text-slate-400 text-sm">السجل يعمل بنجاح</p>
        </div>

        <!-- اختيار المدرس -->
        <div id="v-tch" class="hidden space-y-4">
            <h3 class="text-xl text-cyan-400 font-bold">قائمة المدرسين</h3>
            <button onclick="clearData('grades')" class="bg-red-600 text-white px-4 py-2 rounded text-sm">🗑️ مسح الدرجات بالكامل</button>
            <p class="text-slate-400 text-sm">بوابة المدرسين جاهزة</p>
        </div>
    </main>

    <footer class="text-center text-xs text-slate-500 pt-4">إعدادية المعرفة المهنية © 2026</footer>

    <script>
        function nav(v) {
            ['home', 'ast-login', 'ast-dash', 'tch'].forEach(id => {
                document.getElementById('v-' + id).classList.add('hidden');
            });
            document.getElementById('v-' + v).classList.remove('hidden');
        }

        function checkAst() {
            if(document.getElementById('pass').value === '2020') {
                nav('ast-dash');
            } else {
                alert('الرمز خطأ!');
            }
        }

        function clearData(key) {
            if(confirm('هل تريد مسح البيانات؟')) {
                localStorage.removeItem(key);
                alert('تم التطهير بنجاح!');
            }
        }
    </script>
</body>
</html>
