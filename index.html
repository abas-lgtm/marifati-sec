<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المعرفة - ALPHA-SEC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4">

    <!-- شريط التبديل الرئيسي بين البوابتين -->
    <div class="max-w-5xl mx-auto mb-6 flex justify-center gap-4 bg-slate-800 p-2 rounded-2xl border border-slate-700">
        <button onclick="showPortal('teacher')" id="btn-portal-teacher" class="px-6 py-2 rounded-xl text-sm font-bold bg-amber-500 text-slate-950">بوابة الإدارة والأستاذ</button>
        <button onclick="showPortal('student')" id="btn-portal-student" class="px-6 py-2 rounded-xl text-sm font-bold bg-slate-700 text-slate-300">بوابة الطالب</button>
    </div>

    <!-- ==================== 1. كود الأستاذ والإدارة (كودك القديم) ==================== -->
    <div id="portal-teacher" class="block">
        <!-- ضع هنا كود نظام الغيابات والدرجات القديم بالكامل -->
    </div>

    <!-- ==================== 2. كود بوابة الطالب (الكود الجديد) ==================== -->
    <div id="portal-student" class="hidden">
        <!-- ضع هنا محتوى كود بوابة الطالب (الجدول، الامتحانات، التقييم) -->
    </div>

    <!-- السكربت البرمجي للتحويل -->
    <script>
        function showPortal(portalType) {
            const teacherDiv = document.getElementById('portal-teacher');
            const studentDiv = document.getElementById('portal-student');
            const btnTeacher = document.getElementById('btn-portal-teacher');
            const btnStudent = document.getElementById('btn-portal-student');

            if (portalType === 'teacher') {
                teacherDiv.classList.remove('hidden');
                studentDiv.classList.add('hidden');
                
                btnTeacher.className = "px-6 py-2 rounded-xl text-sm font-bold bg-amber-500 text-slate-950";
                btnStudent.className = "px-6 py-2 rounded-xl text-sm font-bold bg-slate-700 text-slate-300";
            } else {
                studentDiv.classList.remove('hidden');
                teacherDiv.classList.add('hidden');

                btnStudent.className = "px-6 py-2 rounded-xl text-sm font-bold bg-amber-500 text-slate-950";
                btnTeacher.className = "px-6 py-2 rounded-xl text-sm font-bold bg-slate-700 text-slate-300";
            }
        }
    </script>
</body>
</html>
