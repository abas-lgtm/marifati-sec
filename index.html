<style>
.front-ticker-wrap{
  width:100%;
  overflow:hidden;
  background:linear-gradient(90deg,#081820,#0e2935,#081820);
  border-bottom:1.5px solid rgba(251,191,36,.45);
  padding:10px 0;
  direction:rtl;
  font-family:Tahoma,Arial,sans-serif;
}
.front-ticker-track{
  display:flex;
  gap:14px;
  width:max-content;
  padding-right:14px;
  animation:frontScroll 15s linear infinite;
}
.front-ticker-wrap:hover .front-ticker-track{
  animation-play-state:paused;
}
@keyframes frontScroll{
  0%{transform:translateX(0)}
  100%{transform:translateX(50%)}
}
.front-ad-item{
  display:inline-flex;
  align-items:center;
  gap:8px;
  white-space:nowrap;
  padding:7px 14px;
  border-radius:11px;
  font-size:13px;
  font-weight:bold;
  background:#112c38;
  color:#f1f5f9;
  border:1px solid rgba(45,212,191,.35);
}
.front-ad-item.is-urgent{
  background:#4c1117;
  color:#fecaca;
  border-color:#f87171;
}
</style>

<div class="front-ticker-wrap" title="مرر للتوقف وقراءة التبليغ">
  <div id="front-ad-track" class="front-ticker-track"></div>
</div>

<script>
(function(){
  var STORAGE_KEY = "alpha_sec_announcements";
  var lastSnapshot = "";

  function readAnnouncements(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) raw = localStorage.getItem("ann_v2_rows");
      var list = JSON.parse(raw || "[]");
      return Array.isArray(list) ? list : [];
    }catch(e){
      return [];
    }
  }

  function renderFrontTicker(){
    var track = document.getElementById("front-ad-track");
    if(!track) return;
    var rows = readAnnouncements();
    var snap = JSON.stringify(rows);
    if(snap === lastSnapshot && track.innerHTML !== "") return;
    lastSnapshot = snap;

    if(!rows.length){
      var emptyMsg = "<div class='front-ad-item'>📢 إعلانات إعدادية المعرفة المهنية الاهلية — أهلاً بكم في المنصة المدرسية</div>";
      track.innerHTML = emptyMsg + emptyMsg;
      return;
    }

    var cards = rows.map(function(r){
      var urgent = r.prio === "عاجل";
      var cls = urgent ? "front-ad-item is-urgent" : "front-ad-item";
      var badge = urgent ? "🚨 عاجل" : "📌 عادي";
      var target = r.target ? "[" + r.target + "] " : "";
      var title = r.title ? r.title + ": " : "";
      var body = r.body || "";
      var dt = r.dt ? " (" + r.dt + ")" : "";
      return "<div class='" + cls + "'><span>" + badge + "</span><span>" + target + "<strong>" + title + "</strong>" + body + dt + "</span></div>";
    }).join("");

    track.innerHTML = cards + cards;
  }

  renderFrontTicker();
  setInterval(renderFrontTicker, 1000);
  window.addEventListener("storage", renderFrontTicker);
})();
</script>
