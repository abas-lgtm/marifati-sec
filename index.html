<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPHA-SEC // نظام الإدارة المدرسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #030712; color: #f3f4f6; }
        .cyber-font { font-family: 'Fira Code', monospace; }
        .cyber-card { background-color: #0b0f19; border: 1px solid rgba(0, 255, 102, 0.3); }
        .cyber-card:active { transform: scale(0.98); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-black">

    <header class="bg-[#0b0f19] border-b border-emerald-500/30 py-4 px-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🛡️</span>
                <div>
                    <h1 class="text-lg font-black text-emerald-400 cyber-font">ALPHA_SEC // SYSTEM</h1>
                    <p class="text-xs text-slate-400">إعدادية المعرفة المهنية - الأمن السيبراني</p>
                </div>
            </div>
            <button onclick="navTo('home')" class="bg-slate-900 text-emerald-400 px-4 py-2 rounded-lg text-sm font-semibold border border-emerald-500/30 cyber-font">ROOT_HOME</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto w-full p-4 sm:p-6 flex-grow">
        
        <!-- الرئيسية -->
        <div id="p-home" class="text-center py-12">
            <h2 class="text-3xl sm:text-5xl font-black text-white mb-4">نظام الإدارة المدرسية الآمن</h2>
            <p class="text-slate-400 mb-12">اختر البوابة المطلوبة للمتابعة:</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-3xl mx-auto">
                <button onclick="navTo('assistant-login')" class="cyber-card w-full text-right p-8 rounded-2xl shadow-2xl transition hover:border-emerald-400 focus:outline-none">
                    <div class="text-4xl mb-4">⚡</div>
                    <h3 class="text-2xl font-bold text-white mb-2">بوابة المعاون</h3>
                    <p class="text-sm text-slate-400">إدارة الغيابات والسجلات (محمي بررمز VIP10)</p>
                </button>

                <button onclick="openTeacherSelect()" class="cyber-card w-full text-right p-8 rounded-2xl shadow-2xl transition hover:border-cyan-400 focus:outline-none" style="border-color: rgba(6, 182, 212, 0.3);">
                    <div class="text-4xl mb-4">💻</div>
                    <h3 class="text-2xl font-bold text-white mb-2">بوابة المدرسين</h3>
                    <p class="text-sm text-slate-400">رصد درجات الطلاب لمختلف المواد</p>
                </button>
            </div>
        </div>

        <!-- دخول المعاون -->
        <div id="p-assistant-login" class="hidden max-w-md mx-auto cyber-card p-8 rounded-2xl shadow-2xl mt-10">
            <h3 class="text-2xl font-bold text-emerald-400 mb-6 text-center cyber-font">ASSISTANT_AUTH</h3>
            <input type="password" id="ast-pass" placeholder="أدخل رمز المرور (VIP10)" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white mb-4 focus:border-emerald-500 focus:outline-none cyber-font">
            <p id="ast-err" class="text-red-400 text-xs mb-4 hidden">رمز المرور غير صحيح!</p>
            <div class="flex gap-4">
                <button onclick="checkAssistant()" class="flex-1 bg-emerald-500 text-slate-950 font-bold py-3 rounded-lg shadow-lg">دخول</button>
                <button onclick="navTo('home')" class="px-4 bg-slate-900 text-slate-300 rounded-lg">إلغاء</button>
            </div>
        </div>

        <!-- لوحة المعاون -->
        <div id="p-assistant-dash" class="hidden">
            <h3 class="text-2xl font-bold text-emerald-400 cyber-font mb-6">لوحة عمليات المعاون</h3>
            <div class="cyber-card p-6 rounded-xl mb-8">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
                    <input type="text" id="g-name" placeholder="اسم الطالب" class="bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-white">
                    <select id="g-type" class="bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-white">
                        <option value="غياب">غياب</option>
                        <option value="إجازة">إجازة</option>
                        <option value="هروب">هروب من الدرس</option>
                    </select>
                    <select id="g-class" class="bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-white">
                        <option value="أول امن سيبراني A">أول امن سيبراني A</option>
                        <option value="أول امن سيبراني B">أول امن سيبراني B</option>
                    </select>
                </div>
                <button onclick="saveAbsence()" class="bg-emerald-500 text-slate-950 font-bold px-6 py-2 rounded-lg">حفظ الغياب</button>
            </div>
            <div class="cyber-card rounded-xl overflow-hidden">
                <table class="w-full text-right border-collapse">
                    <thead><tr class="bg-slate-950 text-emerald-400 text-xs"><th class="p-4">الطالب</th><th class="p-4">الحالة</th><th class="p-4">القاعة</th></tr></thead>
                    <tbody id="abs-tbody" class="divide-y divide-slate-900"></tbody>
                </table>
            </div>
        </div>

        <!-- اختيار المواد للمدرسين -->
        <div id="p-teacher-select" class="hidden max-w-2xl mx-auto">
            <h3 class="text-2xl font-bold text-cyan-400 cyber-font mb-6">اختر المادة الدراسية</h3>
            <div class="grid grid-cols-1 gap-4" id="subj-box"></div>
        </div>

    </main>

    <footer class="bg-[#0b0f19] border-t border-emerald-500/20 text-center py-6 text-xs text-slate-400">
        <div>تصميم وتطوير: عباس محمد | <span class="text-emerald-400 cyber-font">A B A</span></div>
    </footer>

    <script>
        const subjects = [
            { name: "اللغة العربية", code: "202500" },
            { name: "الرياضيات", code: "1001" },
            { name: "مبادئ الحاسوب", code: "9632" }
        ];

        function navTo(view) {
            ['home', 'assistant-login', 'assistant-dash', 'teacher-select'].forEach(v => {
                document.getElementById('p-' + v).classList.add('hidden');
            });
            document.getElementById('p-' + view).classList.remove('hidden');
            window.scrollTo({top: 0});
        }

        function checkAssistant() {
            if(document.getElementById('ast-pass').value === 'VIP10') {
                navTo('assistant-dash');
                loadAbs();
            } else {
                document.getElementById('ast-err').classList.remove('hidden');
            }
        }

        function saveAbsence() {
            let name = document.getElementById('g-name').value;
            if(!name) { alert('اكتب اسم الطالب'); return; }
            let list = JSON.parse(localStorage.getItem('abs') || '[]');
            list.push({name, type: document.getElementById('g-type').value, cls: document.getElementById('g-class').value});
            localStorage.setItem('abs', JSON.stringify(list));
            document.getElementById('g-name').value = '';
            loadAbs();
            alert('تم الحفظ!');
        }

        function loadAbs() {
            let list = JSON.parse(localStorage.getItem('abs') || '[]');
            let tb = document.getElementById('abs-tbody');
            tb.innerHTML = list.map(i => `<tr class="border-b border-slate-900"><td class="p-4">${i.name}</td><td class="p-4 text-emerald-400">${i.type}</td><td class="p-4">${i.cls}</td></tr>`).join('');
        }

        function openTeacherSelect() {
            navTo('teacher-select');
            let box = document.getElementById('subj-box');
            box.innerHTML = subjects.map(s => `<div class="cyber-card p-4 rounded-xl text-right text-cyan-400 font-bold">${s.name} (رمز: ${s.code})</div>`).join('');
        }
    </script>
</body>
</html>
