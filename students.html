<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPHA-SEC // بوابة درجات الطلاب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #030712; color: #f3f4f6; }
        .cyber-card { background-color: #0b0f19; border: 1px solid rgba(168, 85, 247, 0.4); }
        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            .cyber-card { border: 1px solid #333 !important; background: white !important; color: black !important; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 pb-16">

    <header class="flex justify-between items-center border-b border-purple-500/30 pb-4 no-print">
        <div class="flex flex-col text-right">
            <h1 class="text-white font-bold text-base md:text-lg">بوابة درجات الطلاب الرقمية</h1>
            <span class="text-[11px] md:text-xs text-purple-400 font-mono">إعدادية المعرفة المهنية الاهلية</span>
        </div>
        <button onclick="window.location.href='index.html'" class="bg-slate-900 text-purple-400 px-4 py-2 rounded-lg border border-purple-500/30 text-sm font-semibold cursor-pointer">الرئيسية 🏠</button>
    </header>

    <main class="max-w-xl mx-auto w-full my-8 flex-grow">
        
        <!-- صندوق البحث المبسط -->
        <div class="cyber-card p-6 rounded-2xl shadow-xl space-y-4">
            <div class="text-center">
                <h2 class="text-xl font-bold text-white mb-1">استعلام عن الدرجات</h2>
                <p class="text-xs text-slate-400">اكتب اسمك الثلاثي لعرض بطاقتك الرقمية ودرجاتك فوراً</p>
            </div>

            <div class="flex gap-2 no-print">
                <input type="text" id="student-name-input" placeholder="اكتب اسم الطالب هنا..." class="flex-1 bg-slate-950 border border-slate-800 p-3 rounded-xl text-white text-sm focus:outline-none focus:border-purple-500">
                <button onclick="searchStudentGrades()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold px-5 py-3 rounded-xl text-sm cursor-pointer transition">بحث 🔍</button>
            </div>
        </div>

        <!-- بطاقة الطالب الرقمية (تظهر هنا عند البحث) -->
        <div id="digital-student-card" class="mt-6"></div>

    </main>

    <footer class="fixed bottom-0 left-0 w-full bg-slate-900/95 backdrop-blur-md border-t border-purple-500/30 py-2.5 px-4 z-50 text-center shadow-lg no-print">
      <div class="flex items-center justify-center gap-2 text-xs md:text-sm font-mono dir-rtl">
        <span class="inline-block w-2 h-2 rounded-full bg-purple-500 animate-pulse"></span>
        <span class="text-slate-300">تم التطوير والبرمجة بواسطة:</span>
        <span class="font-bold text-purple-400 tracking-wide border-b border-purple-500/40 pb-0.5">عباس محمد عزيز</span>
      </div>
    </footer>

    <script>
        function searchStudentGrades() {
            let nameInput = document.getElementById('student-name-input').value.trim();
            let cardContainer = document.getElementById('digital-student-card');

            if (!nameInput) {
                alert('الرجاء كتابة اسم الطالب أولاً!');
                return;
            }

            // جلب الدرجات والغيابات المخزنة من الـ localStorage
            let allGrades = JSON.parse(localStorage.getItem('grades') || '[]');
            let allAbsences = JSON.parse(localStorage.getItem('abs') || '[]');

            // تصفية البيانات حسب الاسم المدخل
            let studentGrades = allGrades.filter(item => item.name.includes(nameInput));
            let studentAbsences = allAbsences.filter(item => item.name.includes(nameInput));

            // تصميم بطاقة الطالب الرقمية
            let cardHTML = `
                <div class="cyber-card p-6 rounded-2xl shadow-2xl relative bg-slate-950 border-2 border-purple-500/50">
                    <!-- رأس البطاقة -->
                    <div class="flex justify-between items-center border-b border-purple-500/30 pb-4 mb-4">
                        <div>
                            <span class="text-[10px] uppercase tracking-wider text-purple-400 font-mono">Digital Student ID // بطاقة رسمية</span>
                            <h3 class="text-lg font-black text-white mt-0.5">${nameInput}</h3>
                        </div>
                        <button onclick="window.print()" class="bg-purple-600/80 hover:bg-purple-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer no-print shadow">🖨️ طباعة البطاقة</button>
                    </div>

                    <!-- درجات المواد -->
                    <div class="mb-4">
                        <h4 class="text-xs font-bold text-cyan-400 mb-2">📊 درجات المواد الدراسية المرصودة:</h4>
            `;

            if (studentGrades.length > 0) {
                cardHTML += `<div class="space-y-2">`;
                studentGrades.forEach(g => {
                    cardHTML += `
                        <div class="flex justify-between items-center bg-slate-900/80 p-2.5 rounded-xl border border-slate-800 text-xs">
                            <div>
                                <span class="font-bold text-white">${g.subj}</span>
                                <span class="text-slate-400 block text-[10px]">${g.cls}</span>
                            </div>
                            <span class="text-emerald-400 font-black text-sm bg-emerald-950/50 px-2.5 py-1 rounded-lg border border-emerald-500/30">${g.grade} / 100</span>
                        </div>
                    `;
                });
                cardHTML += `</div>`;
            } else {
                cardHTML += `<p class="text-slate-500 text-xs bg-slate-900/40 p-3 rounded-xl text-center">لا توجد درجات مرصودة لهذا الاسم حالياً.</p>`;
            }

            // سجل الغيابات داخل البطاقة
            cardHTML += `
                    </div>
                    <div>
                        <h4 class="text-xs font-bold text-amber-400 mb-2">📋 سجل الغيابات والدوام:</h4>
            `;

            if (studentAbsences.length > 0) {
                cardHTML += `<div class="space-y-2">`;
                studentAbsences.forEach(a => {
                    cardHTML += `
                        <div class="flex justify-between items-center bg-slate-900/80 p-2.5 rounded-xl border border-slate-800 text-xs">
                            <span class="text-slate-300">${a.date} <span class="text-slate-500">(${a.cls})</span></span>
                            <span class="text-amber-400 font-bold bg-amber-950/50 px-2.5 py-0.5 rounded-lg border border-amber-500/30">${a.type}</span>
                        </div>
                    `;
                });
                cardHTML += `</div>`;
            } else {
                cardHTML += `<p class="text-slate-500 text-xs bg-slate-900/40 p-3 rounded-xl text-center">سجل الدوام نظيف، لا توجد غيابات مسجلة.</p>`;
            }

            cardHTML += `
                    </div>
                    <div class="mt-5 pt-3 border-t border-slate-900 text-center text-[10px] text-slate-500">
                        إعدادية المعرفة المهنية الاهلية - نظام إدارة الطلاب الآمن
                    </div>
                </div>
            `;

            cardContainer.innerHTML = cardHTML;
        }
    </script>
</body>
    </html>
