    <script>
        window.addEventListener('DOMContentLoaded', () => {
            loadStudentSchedule();
        });

        function loadStudentSchedule() {
            let schedule = JSON.parse(localStorage.getItem('school_schedule') || null);
            if (!schedule) {
                schedule = {
                    "الأحد": ["اسلامية", "عربي", "رياضيات", "انكليزي", "طبيعيات", "كهرباء", "رياضة"],
                    "الإثنين": ["رياضيات", "اتصالات", "تجميع", "عربي", "مبادئ", "تطبيقات", "كردي"],
                    "الثلاثاء": ["اتصالات", "تجميع", "انكليزي", "رياضيات", "اسلامية", "طبيعيات", "رياضة"],
                    "الأربعاء": ["عربي", "اسلامية", "تجميع", "اتصالات", "كهرباء", "كردي", "مبادئ"],
                    "الخميس": ["تطبيقات", "انكليزي", "كهرباء", "رياضة", "طبيعيات", "رياضيات", "كردي"]
                };
            }

            let tbody = document.getElementById('student-schedule-body');
            if(tbody) {
                tbody.innerHTML = '';
                for (let day in schedule) {
                    let row = `<tr class="border-b border-purple-500/10"><td class="p-2 font-bold text-purple-400 bg-slate-950">${day}</td>`;
                    let lessons = schedule[day];
                    for(let i = 0; i < 7; i++) {
                        let lesson = (lessons && lessons[i]) ? lessons[i] : "-";
                        row += `<td class="p-2 text-center text-slate-300">${lesson}</td>`;
                    }
                    row += `</tr>`;
                    tbody.innerHTML += row;
                }
            }
        }

        function switchStuTab(tabId) {
            ['tab-sch', 'tab-exm', 'tab-src'].forEach(id => {
                let el = document.getElementById(id);
                let btn = document.getElementById('btn-' + id);
                if(el) el.classList.add('hidden');
                if(btn) btn.className = "bg-slate-900 text-purple-300 px-3 py-1.5 rounded-lg text-xs font-bold cursor-pointer";
            });
            let targetEl = document.getElementById(tabId);
            let targetBtn = document.getElementById('btn-' + tabId);
            if(targetEl) targetEl.classList.remove('hidden');
            if(targetBtn) targetBtn.className = "bg-purple-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold cursor-pointer";
        }

        function searchStu() {
            let q = document.getElementById('stu-search').value.trim();
            if(!q) { alert('الرجاء إدخال اسم الطالب للبحث'); return; }
            
            let grades = JSON.parse(localStorage.getItem('grades') || '[]').filter(i => i.name.includes(q));
            let abs = JSON.parse(localStorage.getItem('abs') || '[]').filter(i => i.name.includes(q));
            
            let resHtml = `
                <div class="cyber-card-purple p-4 rounded-xl border border-purple-500/50 shadow-lg bg-slate-950">
                    <div class="flex justify-between items-center border-b border-purple-500/20 pb-3 mb-3">
                        <div>
                            <h5 class="font-bold text-white text-sm">👤 سجل الطالب: <span class="text-purple-400">${q}</span></h5>
                            <span class="text-[10px] text-slate-400">إعدادية المعرفة المهنية الاهلية</span>
                        </div>
                        <button onclick="window.print()" class="bg-purple-600 hover:bg-purple-600 text-white px-3 py-1 rounded text-[11px] font-semibold cursor-pointer no-print">🖨️ طباعة السجل</button>
                    </div>
                    <div class="space-y-3">
                        <div>
                            <h6 class="font-bold text-cyan-400 mb-1.5 text-xs">📖 درجات المواد المرصودة:</h6>
            `;
            
            resHtml += grades.length ? grades.map(i => `<p class="border-b border-slate-900 py-1 flex justify-between text-xs"><span>${i.subj} <span class="text-slate-500">(${i.cls})</span></span> <span class="text-emerald-400 font-bold">${i.grade}</span></p>`).join('') : `<p class="text-slate-500 text-xs py-1">لا توجد درجات مرصودة لهذا الاسم حالياً</p>`;
            
            resHtml += `
                        </div>
                        <div class="pt-2">
                            <h6 class="font-bold text-amber-400 mb-1.5 text-xs">📋 سجل الغيابات والدوام:</h6>
            `;
            
            resHtml += abs.length ? abs.map(i => `<p class="border-b border-slate-900 py-1 flex justify-between text-xs"><span>${i.date} <span class="text-slate-500">(${i.cls})</span></span> <span class="text-amber-400 font-bold">${i.type}</span></p>`).join('') : `<p class="text-slate-500 text-xs py-1">سجل الدوام نظيف، لا توجد غيابات مسجلة</p>`;
            
            resHtml += `</div></div></div>`;

            let resultsEl = document.getElementById('stu-results');
            if(resultsEl) resultsEl.innerHTML = resHtml;
        }
    </script>
